name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: frontend type-check + lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        # The root package.json only has `build`; every other script lives here.
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run type-check
      - run: bun run lint
      - run: bun run build

  python:
    name: ingestion + api tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.11+ for tomllib, which ingestion/config.py reads config.toml with.
          python-version: "3.11"
      # Deliberately NOT the full requirements files. Both suites are written so
      # the heavy deps (fastembed, qdrant-client, psycopg) are imported lazily
      # inside functions and never reached — these four are all the endpoint
      # tests need, and installing more would only slow the run down.
      - run: pip install "fastapi>=0.115,<1" "pydantic>=2.7,<3" httpx
      - run: python -m unittest discover -s ingestion/tests -v
      - run: python -m unittest discover -s api/tests -v
