# AgentOverflow VM stack.
#
# Qdrant is NOT here any more, and that is the whole point of this file's
# current shape. The vector index was the only component that needed a big
# machine — 2.45M x 384-d vectors plus the HNSW graph, capped at 5g against 2g
# each for Postgres and the API — and it existed solely to serve /v1/search,
# which no agent was calling. The /q solution pages that carry all of the
# site's search traffic are a plain Postgres row lookup and never touched it.
#
# So search is off (AO_SEARCH_DISABLED below) and the container is gone. What
# remains — Postgres, the API, Caddy — serves the full 2.45M-page corpus and
# fits a far smaller instance than e2-standard-4.
#
# To bring search back: restore the qdrant service block and its volume from
# git history, drop AO_SEARCH_DISABLED, and re-run embed-load. The qdrant_data
# volume is deliberately left declared below so an existing VM's index is not
# destroyed by this change — `docker compose down` will not remove it, and it
# is still there to reattach to.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ao
      POSTGRES_DB: ao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ao -d ao"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build: ../api
    restart: unless-stopped
    # Loopback-only: Caddy (below) is the only path in from the internet. Nothing
    # off-box may reach the API except through TLS termination.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AO_INTERNAL_SECRET: ${AO_INTERNAL_SECRET:?set AO_INTERNAL_SECRET in deploy/.env}
      QDRANT_URL: http://qdrant:6333
      # Search off: no Qdrant to query. Endpoints answer 503 with a clear
      # reason instead of hanging on a connection that cannot be made.
      AO_SEARCH_DISABLED: ${AO_SEARCH_DISABLED:-1}
      PG_DSN: postgresql://ao:${POSTGRES_PASSWORD}@postgres:5432/ao
      # Optional: IndexNow instant-submission key (also hosted at /<key>.txt on
      # the site). Unset → ingest-time submission is a no-op. Enables `python -m
      # app.indexnow` bulk backfill of the existing corpus.
      AO_INDEXNOW_KEY: ${AO_INDEXNOW_KEY:-}
      # Site host the submitted /q URLs and the IndexNow keyLocation are built
      # from. Only change it when the frontend domain moves.
      AO_SITE_HOST: ${AO_SITE_HOST:-agentoverflow.aphantic.skinticals.com}
    mem_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # python:3.11-slim has no curl; health requires the internal secret.
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8080/internal/health', headers={'X-AO-Internal-Secret': os.environ['AO_INTERNAL_SECRET']}), timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # 80 serves the ACME challenge + HTTP->HTTPS redirect; 443 is the real API.
    ports:
      - "80:80"
      - "443:443"
    environment:
      AO_API_HOST: ${AO_API_HOST:?set AO_API_HOST in deploy/.env}
      # Platform host the credit/LLM/MCP endpoints proxy to (the Convex slug).
      AO_CONVEX_HOST: ${AO_CONVEX_HOST:?set AO_CONVEX_HOST in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  # Kept declared on purpose: an existing VM still holds the built index here,
  # and leaving the volume named means removing the service does not discard
  # it. Deleting this line is what would make search rebuildable only from a
  # full re-ingest.
  qdrant_data:
  pg_data:
  caddy_data:
  caddy_config:
